services:
  - type: web
    name: rag-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    plan: free              # free to try; if it runs out of memory, switch to a paid plan (e.g. standard, 2 GB)
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LOGFIRE_TOKEN
        sync: false
      - key: PORTKEY_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"

  - type: web
    name: rag-ui
    runtime: docker
    dockerfilePath: ./Dockerfile.ui
    autoDeploy: true
    plan: free
    envVars:
      - key: BACKEND_URL        # public URL of rag-backend, set after it is deployed
        sync: false
      - key: LOGFIRE_TOKEN
        sync: false
